name: Build torch-spyre
description: |
  Runs `uv sync` in the torch-spyre directory to create the .venv
  using the freshly checked-out pyproject.toml + uv.lock,
  and rebuilds torch-spyre from source.

  uv sync only reinstalls torch when the resolved version or source differs
  from what's already installed (e.g. a PR bumps the torch~=2.10.0
  constraint, or the pre-baked venv has a torch from a different index than
  the pytorch-cpu source in uv.lock). torch-spyre itself is always rebuilt
  via --reinstall-package.

inputs:
  torch_spyre_dir:
    description: Path to the cloned torch-spyre repo
    required: false
    type: string
    default: .

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Build torch-spyre
      shell: bash
      env:
        CLONED_TORCH_SPYRE_DIR: ${{ inputs.torch_spyre_dir }}
      run: |
        source "$HOME/.bashrc"
        source /etc/profile.d/ibm-aiu-setup.sh
        pwd
        ls -al
        [[ "$CLONED_TORCH_SPYRE_DIR" != /* ]] && CLONED_TORCH_SPYRE_DIR="${PWD}/${CLONED_TORCH_SPYRE_DIR}"
        cd "$CLONED_TORCH_SPYRE_DIR"
        pwd
        ls -al
        uv sync --verbose --all-extras
        uv pip freeze
        uv pip show torch
